{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'restaurant/style.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lemon - Book</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #333333;
        }

        .page {
            max-width: 1050px;
            margin: 0 auto;
            padding: 30px 24px;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-mark {
            width: 44px;
            height: 62px;
            background: #495e57;
            border-radius: 60% 40% 60% 40%;
            transform: rotate(-12deg);
        }

        .logo-text {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #495e57;
        }

        nav {
            background: #495e57;
            padding: 12px 20px;
            margin-bottom: 36px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-right: 28px;
            font-size: 15px;
            font-weight: 600;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: start;
        }

        h1 {
            font-size: 34px;
            margin-top: 0;
            margin-bottom: 28px;
        }

        h2 {
            font-size: 27px;
            margin-top: 0;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #b8b8b8;
            border-radius: 4px;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            outline: 2px solid #f4ce14;
            border-color: #495e57;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #495e57;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #3f514b;
        }

        #message {
            margin-top: 16px;
            min-height: 24px;
            font-weight: 600;
        }

        .bookings-panel {
            padding-top: 2px;
        }

        #booking-title {
            margin-bottom: 18px;
        }

        #bookings ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #bookings li {
            padding: 9px 0;
            border-bottom: 1px solid #eeeeee;
            font-size: 16px;
        }

        .empty-message {
            color: #777777;
            font-style: italic;
        }

        footer {
            margin-top: 65px;
            padding: 24px 0;
            border-top: 1px solid #bdbdbd;
            text-align: right;
            color: #555555;
            font-size: 14px;
        }

        @media (max-width: 760px) {
            .container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .logo-text {
                font-size: 24px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="brand">
            <div class="logo-mark"></div>
            <div class="logo-text">LITTLE LEMON</div>
        </div>
    </header>

    <nav>
        <a href="/book/">Book</a>
        <a href="/reservations/">Reservations</a>
    </nav>

    <div class="container">

        <section>
            <h1>Make a reservation</h1>

            <form id="booking-form">

                <label for="first_name">First name:</label>
                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="Your name"
                    required
                >

                <label for="reservation_date">Reservation date:</label>
                <input
                    type="date"
                    id="reservation_date"
                    name="reservation_date"
                    required
                >

                <label for="reservation_slot">Reservation time:</label>
                <select
                    id="reservation_slot"
                    name="reservation_slot"
                    required
                >
                    <option value="">Select time</option>
                    <option value="10">10 AM</option>
                    <option value="11">11 AM</option>
                    <option value="12">12 PM</option>
                    <option value="13">1 PM</option>
                    <option value="14">2 PM</option>
                    <option value="15">3 PM</option>
                    <option value="16">4 PM</option>
                    <option value="17">5 PM</option>
                    <option value="18">6 PM</option>
                    <option value="19">7 PM</option>
                    <option value="20">8 PM</option>
                </select>

                <button type="submit">
                    Reserve
                </button>

                <div id="message"></div>
            </form>
        </section>

        <section class="bookings-panel">
            <h2 id="booking-title">Bookings</h2>
            <div id="bookings">Loading...</div>
        </section>

    </div>

    <footer>
        Copyright Little Lemon
    </footer>

</div>

<script>
    const dateInput = document.getElementById("reservation_date");
    const slotSelect = document.getElementById("reservation_slot");
    const bookingsDiv = document.getElementById("bookings");
    const bookingTitle = document.getElementById("booking-title");
    const message = document.getElementById("message");
    const bookingForm = document.getElementById("booking-form");

    function getToday() {
        const today = new Date();

        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    function formatTime(hour) {
        hour = parseInt(hour);

        if (hour === 12) {
            return "12 PM";
        }

        if (hour > 12) {
            return `${hour - 12} PM`;
        }

        return `${hour} AM`;
    }

    function resetTimeSlots() {
        Array.from(slotSelect.options).forEach(option => {
            if (option.value) {
                option.disabled = false;
            }
        });
    }

    async function getBookings() {
        const selectedDate = dateInput.value;

        bookingTitle.textContent = `Bookings For ${selectedDate}`;

        resetTimeSlots();

        try {
            const response = await fetch(
                `/bookings?date=${selectedDate}`
            );

            const data = await response.json();

            if (data.length === 0) {
                bookingsDiv.innerHTML =
                    '<p class="empty-message">No Booking</p>';
                return;
            }

            let html = "<ul>";

            data.forEach(booking => {
                const fields = booking.fields;

                html += `
                    <li>
                        ${fields.first_name}
                        - ${formatTime(fields.reservation_slot)}
                    </li>
                `;

                const option = slotSelect.querySelector(
                    `option[value="${fields.reservation_slot}"]`
                );

                if (option) {
                    option.disabled = true;
                }
            });

            html += "</ul>";

            bookingsDiv.innerHTML = html;

        } catch (error) {
            bookingsDiv.innerHTML =
                '<p class="empty-message">Unable to load bookings.</p>';
        }
    }

    dateInput.addEventListener("change", getBookings);

    bookingForm.addEventListener(
        "submit",
        async function(event) {
            event.preventDefault();

            message.textContent = "";

            const firstName =
                document.getElementById("first_name").value.trim();

            const reservationDate =
                dateInput.value;

            const reservationSlot =
                slotSelect.value;

            if (!firstName || !reservationDate || !reservationSlot) {
                message.textContent =
                    "Please complete all fields.";
                return;
            }

            const payload = {
                first_name: firstName,
                reservation_date: reservationDate,
                reservation_slot: reservationSlot
            };

            try {
                const response = await fetch(
                    "/bookings",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    message.textContent =
                        result.error || "Unable to create reservation.";
                    return;
                }

                message.textContent =
                    "Reservation created successfully.";

                document.getElementById("first_name").value = "";
                slotSelect.value = "";

                await getBookings();

            } catch (error) {
                message.textContent =
                    "Something went wrong. Please try again.";
            }
        }
    );

    dateInput.value = getToday();

    getBookings();
</script>

</body>
</html>
